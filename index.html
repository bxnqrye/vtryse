    <script>
    (function () {
      var theme = localStorage.getItem('vtryse-theme') || 'dark';
      var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
